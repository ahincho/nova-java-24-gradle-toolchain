name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

# El token de Actions de este repositorio es de solo lectura por defecto. Cada job pide lo que
# necesita, en vez de heredar un permiso de escritura que casi ninguno usa.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-gradle.yml@main
    secrets: inherit

  # El toolchain no puede aplicarse a sí mismo, así que valida los commits del PR con el mismo hook
  # que instala en los demás repositorios, sobre el jar recién construido.
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Construir el jar del plugin
        run: ./gradlew :nova-gradle-toolchain-quality:jar --no-configuration-cache
      - name: Validar los mensajes de commit del PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          jar=$(ls nova-gradle-toolchain-quality/build/libs/nova-gradle-toolchain-quality-*.jar | grep -v -e sources -e javadoc)
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! java -cp "$jar" pe.edu.nova.java.gradle.quality.commit.CommitMessageHook "$RUNNER_TEMP/message"; then
              echo "::error::El commit ${sha:0:7} no sigue Conventional Commits."
              failed=1
            fi
          done
          exit $failed

  sonar:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sonarcloud-gradle.yml@main
    with:
      sonar-org: ahincho
      sonar-project-key: ahincho_nova-gradle-toolchain
    secrets: inherit

  matrix:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-matrix.yml@main
    with:
      build-tool: gradle
    secrets: inherit

  owasp:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-owasp-check.yml@main
    with:
      build-tool: gradle
      # NVD confunde dependency-management-plugin con Spring Framework y spring-boot-loader-tools con
      # Spring Tools; llegan con el plugin de Spring Boot. Cada CVE está documentado en
      # docs/owasp-suppressions.json de nova-shared-02-pipelines, acotado a su paquete, igual que en el repo 16.
      cve-suppressions: >-
        CVE-2018-1270,CVE-2022-22965,CVE-2026-47884,CVE-2026-47891,CVE-2026-59283,CVE-2024-22259,CVE-2016-9878,CVE-2018-11040,CVE-2026-47886,CVE-2026-47893,CVE-2026-59282,CVE-2022-31691
    secrets: inherit

  sbom:
    if: github.event_name == 'pull_request'
    # reusable-sbom.yml declara contents: write para adjuntar el SBOM a un release; sin este
    # permiso el workflow entero no llega a arrancar.
    permissions:
      contents: write
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sbom.yml@main
    with:
      build-tool: gradle
    secrets: inherit
