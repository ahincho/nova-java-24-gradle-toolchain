# Las versiones que el toolchain fija para sus consumidores. Es la única fuente: el build las copia
# a un recurso del plugin, y Renovate las puede leer desde aquí.
[versions]
# Formato y análisis
spotless = "8.10.3"
palantir-java-format = "2.100.0"
ktlint = "1.8.0"
checkstyle = "14.3.0"
jacoco = "0.8.15"
# Seguridad
dependency-check = "12.2.2"
cyclonedx = "3.4.1"
# Pruebas
junit = "6.0.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
archunit = "1.5.1"
nova-architecture-rules = "1.1.2"
# Correcciones de seguridad del classpath del plugin: Spotless y OWASP arrastran versiones con CVE.
httpclient5 = "5.6.4"
httpcore5 = "5.4.4"
kotlin = "2.4.20"
# Frameworks y starters de Nova
spring-boot = "4.0.8"
# La que maneja Spring Boot 4.0.8 para la imagen nativa (ADR-045).
native-build-tools = "0.11.5"
# Correcciones de seguridad del classpath de cada servicio. Spring Boot 4.0.8 maneja Tomcat 11.0.24 y
# Jackson 3.1.5, con CVE que ya tienen arreglo; ninguna versión de Spring Boot trae todavía estos parches.
# Cuando Spring Boot los traiga, se borran junto con sus restricciones en el plugin de servicios.
tomcat = "11.0.26"
jackson = "3.1.7"
nova-mask-spring-boot-starter = "3.0.1"
# La 3.0.0 responde los errores con el modelo por capas de ADR-031; la 3.0.1 funciona en una imagen nativa.
nova-api-standard-spring-boot-starter = "3.0.1"

[libraries]
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dependency-check-plugin = { module = "org.owasp:dependency-check-gradle", version.ref = "dependency-check" }
cyclonedx-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }
spring-boot-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
native-build-tools-plugin = { module = "org.graalvm.buildtools:native-gradle-plugin", version.ref = "native-build-tools" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpclient5-cache = { module = "org.apache.httpcomponents.client5:httpclient5-cache", version.ref = "httpclient5" }
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
